<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bodhi Voice Assistant (Test UI)</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        h1 {
            color: #333;
            text-align: center;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <h1>Local Test Page for Bodhi Widget</h1>
    <p style="text-align:center; opacity:0.6;">Click the green button in the bottom right to start</p>
    
    <!-- BODHI HEALTH VOICE ASSISTANT WIDGET (PURE VOICE) -->
<style>
  /* Floating Button */
  #ai-widget-button {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 65px;
    height: 65px;
    background-color: #94C11F; /* Bodhi Green */
    border-radius: 50%;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    cursor: pointer;
    z-index: 999999;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: transform 0.3s;
  }
  #ai-widget-button:hover { transform: scale(1.1); }

  /* Welcome Pop-up Tooltip */
  #ai-welcome-popup {
    position: fixed;
    bottom: 95px;
    right: 25px;
    background-color: white;
    color: #333;
    padding: 12px 18px;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 14px;
    font-weight: 500;
    z-index: 999998;
    opacity: 0;
    visibility: hidden;
    transform: translateY(10px);
    transition: all 0.5s;
    cursor: pointer;
    border: 1px solid #eee;
  }
  #ai-welcome-popup.show {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
  }
  #ai-welcome-popup::after {
    content: '';
    position: absolute;
    bottom: -6px;
    right: 20px;
    border-left: 8px solid transparent;
    border-right: 8px solid transparent;
    border-top: 8px solid white;
  }

  /* Voice Panel Container */
  #ai-voice-panel {
    position: fixed;
    bottom: 95px;
    right: 20px;
    width: 300px;
    background-color: #ffffff;
    border-radius: 20px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    z-index: 999999;
    display: none;
    flex-direction: column;
    align-items: center;
    padding: 30px 20px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    border: 1px solid #eaeaea;
    text-align: center;
  }
  
  #ai-panel-close {
    position: absolute;
    right: 15px;
    top: 15px;
    cursor: pointer;
    font-size: 16px;
    color: #888;
  }
  #ai-panel-close:hover { color: #333; }

  #ai-status {
    font-size: 18px;
    font-weight: bold;
    color: #333;
    margin-bottom: 8px;
    margin-top: 10px;
  }
  
  #ai-sub-text {
    font-size: 13px;
    color: #666;
    margin-bottom: 25px;
  }
</style>

<!-- Widget Elements -->
<div id="ai-welcome-popup" onclick="toggleAIPanel()">
  👋 Welcome! Tap here to speak with our Bodhi Health Expert.
</div>

<div id="ai-widget-button" onclick="toggleAIPanel()">
  <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-5Zm0 0a9 9 0 1 1 18 0m0 0v5a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3Z"/><path d="M21 16v2a4 4 0 0 1-4 4h-5"/></svg>
</div>

<div id="ai-voice-panel">
  <span id="ai-panel-close" onclick="toggleAIPanel()">✖</span>
  <div id="ai-header" style="color:#94C11F; font-weight:bold; font-size:14px; letter-spacing:1px; text-transform:uppercase;">Bodhi Health Support</div>
  <div id="ai-status">Ready</div>
  <div id="ai-sub-text">Tap the mic icon below to speak</div>
  
  <!-- Interactive Mic Graphic -->
  <div id="ai-panel-mic" onclick="handleMicClick()" style="width:70px; height:70px; border-radius:50%; background:#f0f0f0; display:flex; align-items:center; justify-content:center; cursor:pointer; transition: 0.3s; margin-bottom: 15px;">
    <svg id="ai-mic-icon" xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="22"></line></svg>
  </div>

  <!-- Chat Input for Local Testing -->
  <div style="display: flex; width: 100%; gap: 5px;">
    <input type="text" id="ai-chat-input" placeholder="Type a message..." style="flex:1; padding:10px; border:1px solid #ddd; border-radius:8px; font-size:14px; outline:none;" onkeypress="if(event.key === 'Enter') sendChatMessage()">
    <button onclick="sendChatMessage()" style="padding:10px 15px; background:#94C11F; color:white; border:none; border-radius:8px; cursor:pointer; font-weight:bold;">Send</button>
  </div>
</div>

<script>
  // SET BACKEND_URL TO EMPTY STRING SO IT WORKS LOCALLY
  const BACKEND_URL = "";
  const BACKEND_API_KEY = "super_secret_elevenlabs_token_123"; 
  
  let chatHistory = [];
  let recognition;
  let isListening = false;
  let accumulatedTranscript = '';
  let silenceTimer = null;
  let hasUnlockedAudio = false;
  
  const audioPlayer = new Audio();
  let audioQueue = [];
  let isPlayingAudio = false;
  let fetchQueue = [];
  let isFetchingTTS = false;
  let isStreamComplete = true;

  // Initialize Speech Recognition
  if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SpeechRecognition();
    recognition.continuous = true; 
    recognition.interimResults = true; 
    recognition.lang = 'en-IN'; 

    recognition.onresult = (event) => {
      let finalStr = '';
      let interimStr = '';
      for (let i = event.resultIndex; i < event.results.length; ++i) {
        if (event.results[i].isFinal) finalStr += event.results[i][0].transcript + ' ';
        else interimStr += event.results[i][0].transcript;
      }
      accumulatedTranscript += finalStr;
      
      clearTimeout(silenceTimer);
      if ((accumulatedTranscript + interimStr).trim().length > 0) {
        // Automatically send after 0.8s of silence
        silenceTimer = setTimeout(() => {
          if (isListening) stopAndProcess(); 
        }, 800); 
      }
    };

    recognition.onend = () => {
      if (isListening) {
         // Browser automatically paused listening. Restart it seamlessly
         if (accumulatedTranscript.trim() !== '') {
             processVoiceCommand(accumulatedTranscript.trim());
         } else {
             try { recognition.start(); } catch(e) {}
         }
      }
    };
  }

  let prefetchedGreetingUrl = null;
  fetch('data:audio/mp3;base64,' + base64Audio).then(r => r.blob()).then(blob => {
      prefetchedGreetingUrl = URL.createObjectURL(blob);
  });
  function toggleAIPanel() {
    const panel = document.getElementById("ai-voice-panel");
    const popup = document.getElementById("ai-welcome-popup");
    
    if (popup) popup.style.display = "none";
    
    if (panel.style.display === "flex") {
      panel.style.display = "none";
      audioPlayer.pause();
      stopListening(false);
    } else {
      panel.style.display = "flex";
      
      if (!hasUnlockedAudio) {
        audioPlayer.play().catch(() => {});
        hasUnlockedAudio = true;
        if (chatHistory.length === 0) {
            if (prefetchedGreetingUrl) {
                // Instant Playback!
                audioQueue.push(prefetchedGreetingUrl);
                playNextInQueue();
            } else {
                setStatus("Connecting...", "Waking up assistant");
                queueSentenceForTTS("Hello! I am Bodhi Health Support. How can I help you today?", "en");
            }
        }
      }
    }
  }

  function setStatus(main, sub) {
    document.getElementById("ai-status").innerText = main;
    document.getElementById("ai-sub-text").innerText = sub;
  }

  function updateMicVisuals() {
      const micBtn = document.getElementById('ai-panel-mic');
      const micIcon = document.getElementById('ai-mic-icon');
      if (isListening) {
          micBtn.style.background = '#ff4d4d';
          micIcon.style.stroke = 'white';
      } else {
          micBtn.style.background = '#f0f0f0';
          micIcon.style.stroke = '#666';
      }
  }

  function startListening() {
    if (!recognition) return alert("Microphone not supported.");
    clearTimeout(silenceTimer);
    accumulatedTranscript = '';
    isListening = true;
    audioPlayer.pause();
    audioQueue = [];
    fetchQueue = [];
    
    setStatus("Listening...", "Speak now");
    updateMicVisuals();
    try { recognition.start(); } catch(e) {}
  }

  function stopListening(processing) {
    clearTimeout(silenceTimer);
    isListening = false;
    updateMicVisuals();
    try { recognition.stop(); } catch(e) {}
    if (processing) setStatus("Thinking...", "Please wait");
    else setStatus("Ready", "Tap mic to speak");
  }

  function stopAndProcess() {
    stopListening(true);
    const finalInput = accumulatedTranscript.trim();
    if (finalInput !== '') processVoiceCommand(finalInput);
    else startListening();
  }

  function handleMicClick() {
    if (isListening) stopAndProcess();
    else startListening();
  }

  // --- AUDIO QUEUE SYSTEM ---
  function queueSentenceForTTS(sentence, lang) {
      if (!sentence.trim()) return;
      fetchQueue.push({ sentence, lang });
      if (!isFetchingTTS) processFetchQueue();
  }

  async function processFetchQueue() {
      isFetchingTTS = true;
      while (fetchQueue.length > 0) {
          const item = fetchQueue.shift();
          try {
              const ttsUrl = BACKEND_URL + `/api/tts?text=${encodeURIComponent(item.sentence)}&lang=${item.lang}`;
              const res = await fetch(ttsUrl, { headers: { 'Authorization': 'Bearer ' + BACKEND_API_KEY } });
              if (!res.ok) throw new Error("TTS Failed");
              
              const blob = await res.blob();
              audioQueue.push(URL.createObjectURL(blob));
              
              if (!isPlayingAudio) playNextInQueue();
          } catch (err) {
              console.error("TTS Error:", err);
          }
      }
      isFetchingTTS = false;
      checkStreamComplete();
  }

  function playNextInQueue() {
      if (audioQueue.length === 0) {
          isPlayingAudio = false;
          checkStreamComplete();
          return;
      }

      isPlayingAudio = true;
      audioPlayer.src = audioQueue.shift();
      setStatus("Speaking...", "Listen to response");
      
      audioPlayer.onended = () => playNextInQueue();
      audioPlayer.onerror = () => playNextInQueue();
      
      audioPlayer.play().catch(() => playNextInQueue());
  }

  function checkStreamComplete() {
      if (isStreamComplete && fetchQueue.length === 0 && audioQueue.length === 0 && !isPlayingAudio) {
          setStatus("Ready", "Tap mic to speak");
          // If we finished speaking a response, automatically start listening again
          startListening();
      }
  }

  // --- SSE STREAMING REQUEST ---
  async function processVoiceCommand(text) {
      if (!text) return;
      chatHistory.push({ role: 'user', content: text });

      audioQueue = [];
      fetchQueue = [];
      isStreamComplete = false;
      let sentenceBuffer = "";
      let currentLang = "en";

      try {
          const response = await fetch(BACKEND_URL + '/api/chat', {
              method: 'POST',
              headers: { 
                  'Content-Type': 'application/json',
                  'Authorization': 'Bearer ' + BACKEND_API_KEY,
                  'Bypass-Tunnel-Reminder': 'true'
              },
              body: JSON.stringify({ messages: chatHistory })
          });

          if (!response.ok) {
              throw new Error("Server connection error: " + response.status);
          }

          const reader = response.body.getReader();
          const decoder = new TextDecoder("utf-8");

          while (true) {
              const { value, done } = await reader.read();
              if (done) break;

              const chunkStr = decoder.decode(value, { stream: true });
              const lines = chunkStr.split('\n');

              for (const line of lines) {
                  if (line.startsWith('data: ')) {
                      try {
                          const data = JSON.parse(line.replace('data: ', ''));

                          if (data.error) {
                              throw new Error(data.error); // Catch backend errors like API limit
                          } else if (data.type === "language") {
                              currentLang = data.language;
                          } else if (data.type === "content") {
                              sentenceBuffer += data.text;
                              
                              // Split by full sentence punctuation
                              const boundaryRegex = /([^.!?\n]+[.!?\n]+)/;
                              let match;
                              while ((match = boundaryRegex.exec(sentenceBuffer)) !== null) {
                                  const sentence = match[0].trim();
                                  if (sentence.length > 0) {
                                      queueSentenceForTTS(sentence, currentLang);
                                  }
                                  sentenceBuffer = sentenceBuffer.slice(match.index + match[0].length);
                              }
                          } else if (data.type === "metadata") {
                              chatHistory = data.messages;
                          }
                      } catch (e) {
                          if (e.message.includes("limit") || e.message.includes("Error")) {
                              throw e;
                          }
                      }
                  }
              }
          }

          if (sentenceBuffer.trim().length > 0) {
              queueSentenceForTTS(sentenceBuffer.trim(), currentLang);
          }

      } catch (err) {
          console.error("Stream error:", err);
          setStatus("Error", "Please try again");
          // Remove the failed message from history
          chatHistory.pop();
          setTimeout(() => { setStatus("Ready", "Tap mic to speak"); }, 2000);
      } finally {
          isStreamComplete = true;
          checkStreamComplete();
      }
  }

  function sendChatMessage() {
    const input = document.getElementById("ai-chat-input");
    const text = input.value.trim();
    if (text !== "") {
      input.value = "";
      updateStatus("Processing...", "#666");
      processVoiceCommand(text);
    }
  }
