<!-- Bodhi Health Text Chatbot Widget -->
<!-- Paste this HTML anywhere in your Shopify theme (e.g., inside theme.liquid just above the </body> tag) -->

<style>
  /* Reset some basic styles for the widget */
  #bodhi-chat-container {
    font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
    /* Matches the Bodhi Health site's olive-green brand color (logo wave / TRADE link / highlight boxes) */
    --bodhi-green: #96ab3f;
    --bodhi-green-dark: #6e7d2e;
    --bodhi-green-light: #a9c04f;
  }

  /* Teaser Popup (greeting + quick questions) */
  #bodhi-chat-teaser {
    position: fixed;
    bottom: 96px;
    right: 22px;
    width: 290px;
    max-width: calc(100vw - 44px);
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 12px 36px rgba(0, 0, 0, 0.18);
    padding: 16px 16px 14px;
    box-sizing: border-box !important;
    z-index: 2147483646;
    display: none;
    animation: bodhiChatFadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }
  #bodhi-chat-teaser.show {
    display: block;
  }
  #bodhi-chat-teaser::after {
    content: "";
    position: absolute;
    bottom: -8px;
    right: 28px;
    width: 16px;
    height: 16px;
    background: #ffffff;
    transform: rotate(45deg);
    border-radius: 3px;
  }
  #bodhi-teaser-close {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 22px;
    height: 22px;
    min-width: 22px;
    padding: 0 !important;
    box-sizing: border-box !important;
    background: #f0f2f5;
    border: none;
    border-radius: 50%;
    color: #6b7280;
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #bodhi-teaser-close:hover {
    background: #e2e5ea;
  }
  #bodhi-teaser-greeting {
    font-size: 14.5px;
    font-weight: 600;
    color: #1f2430;
    padding-right: 22px;
    margin-bottom: 12px;
    line-height: 1.35;
  }
  #bodhi-chat-teaser .bodhi-teaser-q {
    display: block;
    width: 100%;
    text-align: left;
    background: #ffffff;
    border: 1.5px solid var(--bodhi-green);
    color: var(--bodhi-green-dark);
    font-size: 13px;
    font-weight: 600;
    font-family: inherit;
    padding: 9px 14px !important;
    box-sizing: border-box !important;
    border-radius: 20px;
    cursor: pointer;
    margin-bottom: 8px;
    transition: background-color 0.15s ease, color 0.15s ease;
  }
  #bodhi-chat-teaser .bodhi-teaser-q:last-child {
    margin-bottom: 0;
  }
  #bodhi-chat-teaser .bodhi-teaser-q:hover {
    background: var(--bodhi-green);
    color: #ffffff;
  }

  /* Chat Floating Button */
  #bodhi-chat-toggle-btn {
    position: fixed;
    bottom: 22px;
    right: 22px;
    width: 64px;
    height: 64px;
    min-width: 64px;
    min-height: 64px;
    /* Theme's own global button CSS (e.g. "button { padding: 5px 25px }") otherwise eats into
       this box and squeezes the flex-centered icon down to a couple pixels wide. */
    padding: 0 !important;
    margin: 0;
    box-sizing: border-box !important;
    background: linear-gradient(135deg, var(--bodhi-green-light), var(--bodhi-green-dark));
    color: white;
    border: none;
    border-radius: 50%;
    box-shadow: 0 6px 20px rgba(150, 171, 63, 0.45);
    cursor: pointer;
    z-index: 2147483647;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }
  #bodhi-chat-toggle-btn:hover {
    transform: scale(1.08);
    box-shadow: 0 8px 26px rgba(150, 171, 63, 0.55);
  }
  #bodhi-chat-toggle-btn:active {
    transform: scale(0.96);
  }
  #bodhi-chat-toggle-btn svg {
    width: 32px;
    height: 32px;
    fill: currentColor;
    flex-shrink: 0;
  }
  #bodhi-chat-toggle-btn .bodhi-icon-close {
    display: none;
  }
  #bodhi-chat-toggle-btn.open .bodhi-icon-chat {
    display: none;
  }
  #bodhi-chat-toggle-btn.open .bodhi-icon-close {
    display: block;
  }

  /* Chat Window */
  #bodhi-chat-window {
    position: fixed;
    bottom: 96px;
    right: 22px;
    width: 366px;
    height: 560px;
    max-height: calc(100vh - 130px);
    background-color: #ffffff;
    border-radius: 18px;
    box-shadow: 0 16px 48px rgba(0, 0, 0, 0.22);
    display: none; /* Hidden by default */
    flex-direction: column;
    overflow: hidden;
    z-index: 2147483647;
    animation: bodhiChatFadeIn 0.28s cubic-bezier(0.16, 1, 0.3, 1);
  }

  @keyframes bodhiChatFadeIn {
    from { opacity: 0; transform: translateY(16px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  @media (max-width: 480px) {
    #bodhi-chat-window {
      width: calc(100vw - 24px);
      height: calc(100vh - 110px);
      right: 12px;
      bottom: 86px;
    }
    #bodhi-chat-toggle-btn {
      right: 16px;
      bottom: 16px;
    }
  }

  /* Chat Header */
  #bodhi-chat-header {
    background: linear-gradient(135deg, var(--bodhi-green-light), var(--bodhi-green-dark));
    color: white;
    padding: 16px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
  }
  #bodhi-chat-header-info {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  #bodhi-chat-header-title {
    font-weight: 600;
    font-size: 15.5px;
  }
  #bodhi-chat-header-status {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: rgba(255, 255, 255, 0.85);
    font-weight: 400;
  }
  #bodhi-chat-header-status .bodhi-status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background-color: #7ee787;
    box-shadow: 0 0 0 2px rgba(126, 231, 135, 0.25);
  }
  #bodhi-chat-close-btn {
    background: rgba(255, 255, 255, 0.15);
    border: none;
    color: white;
    font-size: 20px;
    line-height: 1;
    width: 28px;
    height: 28px;
    min-width: 28px;
    padding: 0 !important;
    box-sizing: border-box !important;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background-color 0.2s;
  }
  #bodhi-chat-close-btn:hover {
    background: rgba(255, 255, 255, 0.28);
  }

  /* Chat Messages Area */
  #bodhi-chat-messages {
    flex: 1;
    padding: 16px;
    overflow-y: auto;
    background-color: #f5f7fa;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  #bodhi-chat-messages::-webkit-scrollbar {
    width: 6px;
  }
  #bodhi-chat-messages::-webkit-scrollbar-thumb {
    background-color: rgba(0, 0, 0, 0.15);
    border-radius: 10px;
  }

  /* Message Bubbles */
  .bodhi-msg {
    max-width: 82%;
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.45;
    word-wrap: break-word;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
  }
  .bodhi-msg.bot {
    align-self: flex-start;
    background-color: #ffffff;
    color: #222933;
    border-bottom-left-radius: 4px;
  }
  .bodhi-msg.user {
    align-self: flex-end;
    background: linear-gradient(135deg, var(--bodhi-green-light), var(--bodhi-green-dark));
    color: white;
    border-bottom-right-radius: 4px;
    box-shadow: 0 2px 6px rgba(150, 171, 63, 0.3);
  }
  .bodhi-msg a {
    color: inherit;
    font-weight: 600;
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  .bodhi-msg.bot a {
    color: var(--bodhi-green-dark);
  }

  /* Chat Input Area */
  #bodhi-chat-input-area {
    padding: 14px;
    background-color: #ffffff;
    border-top: 1px solid #edf0f3;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  #bodhi-chat-input {
    flex: 1;
    padding: 11px 16px;
    border: 1.5px solid #e0e4e9;
    background-color: #f5f7fa;
    border-radius: 24px;
    outline: none;
    font-size: 14px;
    font-family: inherit;
    transition: border-color 0.2s, background-color 0.2s;
  }
  #bodhi-chat-input:focus {
    border-color: var(--bodhi-green-light);
    background-color: #ffffff;
  }
  #bodhi-chat-input::placeholder {
    color: #9aa3ae;
  }
  #bodhi-chat-send-btn {
    background: linear-gradient(135deg, var(--bodhi-green-light), var(--bodhi-green-dark));
    color: white;
    border: none;
    border-radius: 50%;
    width: 42px;
    height: 42px;
    min-width: 42px;
    min-height: 42px;
    /* Theme's own global button CSS (e.g. "button { padding: 5px 25px }") otherwise eats into
       this box and squeezes the flex-centered icon down to a couple pixels wide. */
    padding: 0 !important;
    margin: 0;
    box-sizing: border-box !important;
    flex-shrink: 0;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    box-shadow: 0 3px 10px rgba(150, 171, 63, 0.35);
  }
  #bodhi-chat-send-btn:hover {
    transform: scale(1.06);
  }
  #bodhi-chat-send-btn:active {
    transform: scale(0.94);
  }
  #bodhi-chat-send-btn svg {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
    fill: currentColor;
    margin-left: -2px; /* Visual alignment for send icon */
  }

  /* Product Cards */
  .bodhi-product-card {
    display: flex;
    align-items: center;
    gap: 10px;
    align-self: flex-start;
    max-width: 82%;
    background: #ffffff;
    border: 1.5px solid #e5e8ec;
    border-radius: 12px;
    padding: 8px;
    box-sizing: border-box !important;
    text-decoration: none;
    color: inherit;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .bodhi-product-card:hover {
    border-color: var(--bodhi-green);
    box-shadow: 0 4px 12px rgba(150, 171, 63, 0.25);
  }
  .bodhi-product-card img {
    width: 52px;
    height: 52px;
    min-width: 52px;
    object-fit: cover;
    border-radius: 8px;
    background: #f0f2f5;
  }
  .bodhi-product-card-info {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }
  .bodhi-product-card-title {
    font-size: 13px;
    font-weight: 700;
    color: #1f2430;
    line-height: 1.3;
  }
  .bodhi-product-card-cta {
    font-size: 12px;
    font-weight: 600;
    color: var(--bodhi-green-dark);
  }

  /* Loading Indicator */
  .bodhi-typing {
    display: none;
    align-self: flex-start;
    background-color: #ffffff;
    padding: 12px 16px;
    border-radius: 16px;
    border-bottom-left-radius: 4px;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
  }
  .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    background-color: #9aa3ae;
    border-radius: 50%;
    margin: 0 2px;
    animation: typing 1.4s infinite ease-in-out both;
  }
  .dot:nth-child(1) { animation-delay: -0.32s; }
  .dot:nth-child(2) { animation-delay: -0.16s; }
  @keyframes typing {
    0%, 80%, 100% { transform: scale(0); }
    40% { transform: scale(1); }
  }
</style>

<div id="bodhi-chat-container">
  <!-- Teaser Popup -->
  <div id="bodhi-chat-teaser">
    <button id="bodhi-teaser-close" type="button" aria-label="Dismiss">&times;</button>
    <div id="bodhi-teaser-greeting">&#128075; Need help finding the right supplement?</div>
    <button type="button" class="bodhi-teaser-q">What products do you offer?</button>
    <button type="button" class="bodhi-teaser-q">Do you have anything for sleep?</button>
    <button type="button" class="bodhi-teaser-q">How do I track my order?</button>
    <button type="button" class="bodhi-teaser-q">What's your return policy?</button>
  </div>

  <!-- The Floating Button -->
  <button id="bodhi-chat-toggle-btn" type="button" aria-label="Open chat" style="padding:0 !important;">
    <svg class="bodhi-icon-chat" viewBox="0 0 24 24" style="fill:#ffffff !important;"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z" style="fill:#ffffff !important;"/></svg>
    <svg class="bodhi-icon-close" viewBox="0 0 24 24" style="fill:#ffffff !important;"><path d="M18.3 5.71a1 1 0 00-1.41 0L12 10.59 7.11 5.7A1 1 0 105.7 7.11L10.59 12l-4.9 4.89a1 1 0 101.41 1.41L12 13.41l4.89 4.9a1 1 0 001.41-1.41L13.41 12l4.9-4.89a1 1 0 000-1.4z" style="fill:#ffffff !important;"/></svg>
  </button>

  <!-- The Chat Window -->
  <div id="bodhi-chat-window">
    <div id="bodhi-chat-header">
      <div id="bodhi-chat-header-info">
        <div id="bodhi-chat-header-title">Bodhi Health Assistant</div>
        <div id="bodhi-chat-header-status"><span class="bodhi-status-dot"></span>Online now</div>
      </div>
      <button id="bodhi-chat-close-btn">&times;</button>
    </div>

    <div id="bodhi-chat-messages">
      <!-- Default Greeting -->
      <div class="bodhi-msg bot">
        Hi there! I'm the Bodhi Health assistant. How can I help you with your health and wellness today?
      </div>

      <!-- Typing Indicator (Hidden by default) -->
      <div id="bodhi-chat-typing" class="bodhi-typing">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      </div>
    </div>

    <div id="bodhi-chat-input-area">
      <input type="text" id="bodhi-chat-input" placeholder="Type a message..." autocomplete="off">
      <button id="bodhi-chat-send-btn" type="button" aria-label="Send message" style="padding:0 !important;">
        <svg viewBox="0 0 24 24" width="18" height="18" style="display:block !important; width:18px !important; height:18px !important; flex-shrink:0 !important; fill:#ffffff !important;"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" style="fill:#ffffff !important;"/></svg>
      </button>
    </div>
  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    const toggleBtn = document.getElementById('bodhi-chat-toggle-btn');
    const closeBtn = document.getElementById('bodhi-chat-close-btn');
    const chatWindow = document.getElementById('bodhi-chat-window');
    const sendBtn = document.getElementById('bodhi-chat-send-btn');
    const chatInput = document.getElementById('bodhi-chat-input');
    const messagesContainer = document.getElementById('bodhi-chat-messages');
    const typingIndicator = document.getElementById('bodhi-chat-typing');
    const teaser = document.getElementById('bodhi-chat-teaser');
    const teaserCloseBtn = document.getElementById('bodhi-teaser-close');
    const teaserQuestionBtns = document.querySelectorAll('.bodhi-teaser-q');

    // CONFIGURE YOUR API HERE
    const API_URL = 'http://localhost:3000/api/chat';
    const API_TOKEN = 'super_secret_elevenlabs_token_123'; // Make sure this matches your .env API_SECRET

    let chatHistory = [
      { role: "system", content: "You are a helpful assistant for Bodhi Health." }
    ];

    function hideTeaser() {
      teaser.classList.remove('show');
    }

    function openChat() {
      chatWindow.style.display = 'flex';
      toggleBtn.classList.add('open');
      hideTeaser();
      chatInput.focus();
    }

    function closeChat() {
      chatWindow.style.display = 'none';
      toggleBtn.classList.remove('open');
    }

    function toggleChat() {
      if (chatWindow.style.display === 'flex') {
        closeChat();
      } else {
        openChat();
      }
    }

    toggleBtn.addEventListener('click', toggleChat);
    closeBtn.addEventListener('click', toggleChat);

    teaserCloseBtn.addEventListener('click', function() {
      hideTeaser();
      try { sessionStorage.setItem('bodhiTeaserDismissed', '1'); } catch (e) {}
    });
    teaserQuestionBtns.forEach(function(qBtn) {
      qBtn.addEventListener('click', function() {
        const question = qBtn.textContent.trim();
        openChat();
        sendMessage(question);
      });
    });

    // Show the teaser a couple seconds after the page loads, once per visit,
    // so it doesn't pop up again every time the customer navigates pages.
    try {
      if (!sessionStorage.getItem('bodhiTeaserDismissed')) {
        setTimeout(function() {
          if (chatWindow.style.display !== 'flex') {
            teaser.classList.add('show');
          }
        }, 2500);
      }
    } catch (e) {
      setTimeout(function() { teaser.classList.add('show'); }, 2500);
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    async function sendMessage(presetText) {
      const text = (typeof presetText === 'string' ? presetText : chatInput.value).trim();
      if (!text) return;

      appendMessage(text, 'user');
      chatHistory.push({ role: "user", content: text });
      chatInput.value = '';

      typingIndicator.style.display = 'block';
      messagesContainer.scrollTop = messagesContainer.scrollHeight;

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${API_TOKEN}`
          },
          body: JSON.stringify({ messages: chatHistory })
        });

        typingIndicator.style.display = 'none';

        if (!response.ok) {
          appendMessage("Sorry, there was an error connecting to the server.", 'bot');
          return;
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder("utf-8");

        let botMsgDiv = createMessageBubble('bot');
        let fullBotReply = "";
        let buffer = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });

          let eventEndIndex;
          while ((eventEndIndex = buffer.indexOf('\n\n')) !== -1) {
            const eventStr = buffer.slice(0, eventEndIndex);
            buffer = buffer.slice(eventEndIndex + 2);

            const lines = eventStr.split('\n');
            for (const line of lines) {
              if (line.startsWith('data: ')) {
                const dataStr = line.replace('data: ', '').trim();
                if (dataStr === '[DONE]') continue;

                try {
                  const parsed = JSON.parse(dataStr);
                  if (parsed.text) {
                    fullBotReply += parsed.text;
                    // Escape first so any HTML/script in the LLM reply can't execute,
                    // then apply our own minimal markdown (links + bold + line breaks) on top.
                    // Link URLs are restricted to http(s) only, so an injected javascript: URI can't run.
                    let htmlReply = escapeHtml(fullBotReply)
                      .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
                      .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                      .replace(/\n/g, '<br>');
                    botMsgDiv.innerHTML = htmlReply;
                    messagesContainer.scrollTop = messagesContainer.scrollHeight;
                  }
                  if (parsed.error) {
                    botMsgDiv.innerText = "Error: " + parsed.error;
                  }
                  if (parsed.type === 'metadata' && Array.isArray(parsed.products)) {
                    addProductCards(parsed.products);
                  }
                } catch (e) {
                  console.error("Parse error on chunk", e);
                }
              }
            }
          }
        }

        chatHistory.push({ role: "assistant", content: fullBotReply });

      } catch (error) {
        typingIndicator.style.display = 'none';
        appendMessage("Network error. Please try again later.", 'bot');
      }
    }

    function createMessageBubble(sender) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `bodhi-msg ${sender}`;
      messagesContainer.insertBefore(msgDiv, typingIndicator);
      return msgDiv;
    }

    function addProductCards(products) {
      products.slice(0, 3).forEach(function(product) {
        if (!product || !product.url) return;

        const link = document.createElement('a');
        link.className = 'bodhi-product-card';
        link.href = product.url;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';

        if (product.featured_image) {
          const img = document.createElement('img');
          img.src = product.featured_image;
          img.alt = product.title || '';
          link.appendChild(img);
        }

        const info = document.createElement('div');
        info.className = 'bodhi-product-card-info';

        const title = document.createElement('div');
        title.className = 'bodhi-product-card-title';
        title.textContent = product.title || 'View product';
        info.appendChild(title);

        const cta = document.createElement('div');
        cta.className = 'bodhi-product-card-cta';
        cta.textContent = 'View product →';
        info.appendChild(cta);

        link.appendChild(info);
        messagesContainer.insertBefore(link, typingIndicator);
      });
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function appendMessage(text, sender) {
      const msgDiv = createMessageBubble(sender);
      msgDiv.innerText = text;
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    chatInput.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        sendMessage();
      }
    });

    sendBtn.addEventListener('click', sendMessage);
  });
</script>
